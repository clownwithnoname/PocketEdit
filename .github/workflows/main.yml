
name: Build Pocket Edit APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: |
          export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          bash ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-Edit-APK
          path: build/Pocket-Edit-1.2.apk
